<!DOCTYPE html>
<!--/* Legacy equivalent: banner.jsp. Each slice adds its own entry to the banner. */-->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
  <body>
    <header class="banner" th:fragment="banner">
      <a class="banner-logo" th:href="@{/}" href="/">
        <img th:src="@{/images/banner_logo.gif}" th:alt="#{site.name}" alt="Pet Store" height="60" />
      </a>
      <div class="banner-tools">
        <form class="banner-search" th:action="@{/search}" action="/search" method="get" role="search">
          <input type="search" name="keywords" size="8" th:attr="aria-label=#{banner.search}" />
          <button type="submit" th:text="#{banner.search}">Search</button>
        </form>
        <nav class="banner-links">
          <a th:href="@{/cart}" href="/cart" th:text="#{banner.cart}">Cart</a>
          <a sec:authorize="isAnonymous()" th:href="@{/signin}" href="/signin" th:text="#{banner.signin}">Sign in</a>
          <form sec:authorize="isAuthenticated()" class="banner-signout" th:action="@{/signout}" action="/signout" method="post">
            <button type="submit" class="link-button" th:text="#{banner.signout}">Sign out</button>
          </form>
        </nav>
      </div>
    </header>
  </body>
</html>
