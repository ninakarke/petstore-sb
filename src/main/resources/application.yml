spring:
  application:
    name: petstore

  # Default run mode: an embedded, in-memory H2 database that needs no setup.
  # The schema is created by the Flyway migrations in db/migration and only
  # validated by Hibernate, never generated by it.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    placeholders:
      # Appended to text columns that are sorted on. Empty for H2, which
      # compares strings by code point already. See application-postgres.yml.
      binaryCollation: ""

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
