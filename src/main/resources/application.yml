spring:
  application:
    name: petstore

  # Default run mode: an embedded, in-memory H2 database that needs no setup.
  # The schema is created by the Flyway migrations in db/migration and only
  # validated by Hibernate, never generated by it.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    placeholders:
      # Appended to the text columns that lists are sorted on, to make every
      # database order them the same way (by code point). Empty for H2, which
      # does that already. See application-postgres.yml.
      binaryCollation: ""

  # Catalog reads are cached for five minutes, as the legacy pages were, but
  # in a cache with a size limit. The legacy cache tag never removed an entry.
  cache:
    cache-names: catalog.categories
    caffeine:
      spec: maximumSize=200,expireAfterWrite=300s

petstore:
  security:
    # Pages that require a signed-in customer; everything else is public.
    # Legacy: the <constraint> entries of WEB-INF/signon-config.xml (the
    # account pages and the order form). The legacy list did not include
    # the URL that actually placed the order; this one does.
    protected-paths:
      - /account/**
      - /checkout/**
      - /orders/**
    # Bearer tokens of the JSON API. Set PETSTORE_TOKEN_SECRET (Base64, at
    # least 32 bytes) to keep tokens valid across restarts and instances.
    token:
      secret: ${PETSTORE_TOKEN_SECRET:}
      lifetime: 15m
  catalog:
    # Results per page on the category, product and search pages (legacy: 2).
    page-size: 2
    # Upper limit for a page size requested through the API.
    max-page-size: 50

# The generated API description covers the JSON endpoints only, not the pages.
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
