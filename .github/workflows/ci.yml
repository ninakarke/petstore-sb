name: CI

# Every push and pull request runs the same gates a developer runs locally
# with `./mvnw verify`: toolchain enforcement, tests, formatting, coverage,
# module boundaries and architecture rules.
#
# The tests cover all three data stores in one run: embedded H2, and
# PostgreSQL and MongoDB servers that the tests start themselves in
# containers (the runner has Docker). No database has to be set up here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            target/surefire-reports
            target/site/jacoco
            target/spring-modulith-docs

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag petstore:ci .
