# The Docker-backed run modes.
#
# A database only; run the application yourself with the matching profile:
#
#   docker compose up -d postgres            then profile "postgres"
#   docker compose up -d mongo               then profile "mongo"
#
# A database and the application, both in containers, on http://localhost:8080
# (one at a time, they use the same port):
#
#   docker compose --profile app up --build          with PostgreSQL
#   docker compose --profile app-mongo up --build    with MongoDB
#
# Stop with the same options and `down` (data is kept), or `down -v` (data is
# deleted). This stops whatever is running, whichever way it was started:
#
#   docker compose --profile app --profile app-mongo down -v
#
# The default run mode needs none of this: it uses an embedded database.
# Credentials here are for local development only.

services:
  # Each database belongs to the profile of the application variant that uses
  # it, so a variant starts its own database and not the other one. Naming a
  # database on the command line (`up -d postgres`) starts it without a profile.
  postgres:
    profiles: ["app"]
    image: postgres:18
    environment:
      POSTGRES_DB: petstore
      POSTGRES_USER: petstore
      POSTGRES_PASSWORD: petstore
    ports:
      - "5432:5432"
    volumes:
      - petstore-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petstore -d petstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A single MongoDB server, no replica set: the application needs no
  # multi-document transactions.
  mongo:
    profiles: ["app-mongo"]
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - petstore-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The application itself, built from the Dockerfile, once per data store.
  app:
    profiles: ["app"]
    build: .
    image: petstore:local
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      PETSTORE_DB_URL: jdbc:postgresql://postgres:5432/petstore
    ports:
      - "8080:8080"
    volumes: &pictures
      # Optional original pet pictures; placeholders are shown without them.
      - ./local/legacy-images:/app/local/legacy-images:ro
    depends_on:
      postgres:
        condition: service_healthy

  app-mongo:
    profiles: ["app-mongo"]
    build: .
    image: petstore:local
    environment:
      SPRING_PROFILES_ACTIVE: mongo
      PETSTORE_MONGODB_URI: mongodb://mongo:27017/petstore
    ports:
      - "8080:8080"
    volumes: *pictures
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  petstore-postgres:
  petstore-mongo:
